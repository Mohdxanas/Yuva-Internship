<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Orbit — a Single Page Application simulation with client-side routing." />
  <title>Orbit SPA</title>
  <!-- Deep links like /products/nova-watch need root-relative assets. On http(s) a <base href="/">
       is added and assets are written after it (so the browser's preload scanner does not
       request them relative to /products/). On file:// plain relative paths are used. -->
  <script>
    var ORBIT_ASSETS = [
      "css/styles.css", "js/data.js", "js/store.js", "js/router.js", "js/views.js", "js/app.js"
    ];
    if (location.protocol !== "file:") document.write('<base href="/">');
    document.write('<link rel="stylesheet" href="' + ORBIT_ASSETS[0] + '" />');
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%235b4bff'/%3E%3C/svg%3E" />
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>

  <header class="site-header">
    <a href="/" class="brand" data-link aria-label="Orbit home">
      <span class="brand-dot"></span> Orbit
    </a>

    <button class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="nav" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>

    <nav id="nav" class="nav" aria-label="Main">
      <a href="/" data-link>Home</a>
      <a href="/products" data-link>Products</a>
      <a href="/about" data-link>About</a>
      <a href="/contact" data-link>Contact</a>
    </nav>

    <div class="header-tools">
      <a href="/cart" data-link class="cart-btn" aria-label="Cart">
        🛒 <span id="cart-count" class="badge">0</span>
      </a>
      <button id="theme-toggle" class="icon-btn" aria-label="Toggle dark mode">🌓</button>
    </div>
  </header>

  <div id="progress" class="progress" aria-hidden="true"></div>

  <!-- Main container: all dynamic content is rendered here -->
  <main id="view" class="view" tabindex="-1" aria-live="polite"></main>

  <footer class="site-footer">
    <p>Orbit SPA Simulation · Week 5 Project · No full page reloads.</p>
    <p class="muted" id="route-info"></p>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript><p class="noscript">This application requires JavaScript.</p></noscript>

  <!-- Classic scripts (not ES modules) so the app also works from file:// -->
  <script>
    ORBIT_ASSETS.slice(1).forEach(function (src) { document.write('<script src="' + src + '"><\/script>'); });
  </script>
</body>
</html>
